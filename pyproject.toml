[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftgate"
version = "0.1.0"
description = "Impact-weighted SHAP Wasserstein retraining gatekeeper and ETL fault isolator for tabular ML pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Satvik Pachipulusu"}
]
keywords = ["mlops", "drift-detection", "shap", "wasserstein", "lightgbm", "xgboost", "ci-cd"]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]